<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#121421" rx="8"/>
<rect x="30" y="110" width="220" height="160" rx="10" fill="#1b1e30" stroke="#199e70" stroke-width="2"/>
<text x="140.0" y="138.0" font-size="17" fill="#ebebf5" text-anchor="middle" font-weight="bold">Gazebo</text>
<text x="140.0" y="164.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">physics, 1 ms steps</text>
<text x="140.0" y="185.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">29 joint controllers</text>
<text x="140.0" y="206.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">IMU, odometry</text>
<rect x="380" y="90" width="200" height="200" rx="10" fill="#1b1e30" stroke="#3987e5" stroke-width="2"/>
<text x="480.0" y="118.0" font-size="17" fill="#ebebf5" text-anchor="middle" font-weight="bold">policy_runner</text>
<text x="480.0" y="144.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">ROS 2 node (C++)</text>
<text x="480.0" y="165.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">every 20 ms:</text>
<text x="480.0" y="186.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">observation</text>
<text x="480.0" y="207.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">-> ONNX network</text>
<text x="480.0" y="228.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">-> 29 targets</text>
<rect x="700" y="110" width="190" height="160" rx="10" fill="#1b1e30" stroke="#c98500" stroke-width="2"/>
<text x="795.0" y="138.0" font-size="17" fill="#ebebf5" text-anchor="middle" font-weight="bold">ONNX file</text>
<text x="795.0" y="164.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">network weights</text>
<text x="795.0" y="185.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">metadata: joints,</text>
<text x="795.0" y="206.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">default pose, scale,</text>
<text x="795.0" y="227.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">observation terms</text>
<line x1="250" y1="160" x2="372" y2="160" stroke="#199e70" stroke-width="2"/>
<polygon points="380,160 370,155 370,165" fill="#199e70"/>
<text x="315.0" y="131.0" font-size="12" fill="#a3a6c0" text-anchor="middle" font-weight="normal">joint states, IMU,</text>
<text x="315.0" y="148.0" font-size="12" fill="#a3a6c0" text-anchor="middle" font-weight="normal">odometry</text>
<line x1="380" y1="230" x2="258" y2="230" stroke="#3987e5" stroke-width="2"/>
<polygon points="250,230 260,225 260,235" fill="#3987e5"/>
<text x="315.0" y="254.0" font-size="12" fill="#a3a6c0" text-anchor="middle" font-weight="normal">29 joint targets</text>
<line x1="700" y1="190" x2="588" y2="190" stroke="#c98500" stroke-width="2"/>
<polygon points="580,190 590,185 590,195" fill="#c98500"/>
<text x="640.0" y="178.0" font-size="12" fill="#a3a6c0" text-anchor="middle" font-weight="normal">loaded at start</text>
<line x1="480" y1="34" x2="480" y2="82" stroke="#ebebf5" stroke-width="2"/>
<polygon points="480,90 475,80 485,80" fill="#ebebf5"/>
<text x="492.0" y="52.0" font-size="12" fill="#a3a6c0" text-anchor="start" font-weight="normal">velocity command (/cmd_vel)</text>
<text x="460.0" y="325.0" font-size="13" fill="#a3a6c0" text-anchor="middle" font-weight="normal">The same node runs both policies: everything policy-specific comes from the ONNX metadata.</text>
</svg>
