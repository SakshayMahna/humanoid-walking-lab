<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="425" rx="10" fill="#12141f"/>
  <text x="24" y="32" fill="#ebebf5" font-size="17">Inside walk.onnx: the actor network</text>

  <!-- faint connections between layers (centre y = 200) -->
  <g stroke="#3a3f5c" stroke-width="1" opacity="0.8">
    <line x1="92" y1="140" x2="168" y2="140"/><line x1="92" y1="200" x2="168" y2="200"/><line x1="92" y1="260" x2="168" y2="260"/>
    <line x1="212" y1="140" x2="298" y2="80"/><line x1="212" y1="140" x2="298" y2="200"/><line x1="212" y1="200" x2="298" y2="120"/>
    <line x1="212" y1="200" x2="298" y2="280"/><line x1="212" y1="260" x2="298" y2="320"/><line x1="212" y1="260" x2="298" y2="200"/>
    <line x1="342" y1="80" x2="438" y2="110"/><line x1="342" y1="200" x2="438" y2="200"/><line x1="342" y1="320" x2="438" y2="290"/>
    <line x1="342" y1="140" x2="438" y2="250"/><line x1="342" y1="260" x2="438" y2="150"/>
    <line x1="482" y1="110" x2="558" y2="140"/><line x1="482" y1="200" x2="558" y2="200"/><line x1="482" y1="290" x2="558" y2="260"/>
    <line x1="482" y1="150" x2="558" y2="240"/><line x1="482" y1="250" x2="558" y2="160"/>
    <line x1="602" y1="140" x2="668" y2="172"/><line x1="602" y1="200" x2="668" y2="200"/><line x1="602" y1="260" x2="668" y2="228"/>
  </g>

  <!-- input: 99 observations -->
  <rect x="48" y="120" width="44" height="160" rx="8" fill="#36a2eb" fill-opacity="0.25" stroke="#36a2eb" stroke-width="2"/>
  <text x="70" y="108" fill="#36a2eb" text-anchor="middle">obs</text>
  <text x="70" y="300" fill="#ebebf5" text-anchor="middle">99</text>

  <!-- normalizer -->
  <rect x="168" y="120" width="44" height="160" rx="8" fill="#ffce56" fill-opacity="0.2" stroke="#ffce56" stroke-width="2"/>
  <text x="190" y="108" fill="#ffce56" text-anchor="middle">normalize</text>
  <text x="190" y="300" fill="#ebebf5" text-anchor="middle">(x − mean)</text>
  <text x="190" y="318" fill="#ebebf5" text-anchor="middle">/ std</text>
  <text x="190" y="340" fill="#9a9fc0" text-anchor="middle" font-size="12">Sub, Div</text>

  <!-- hidden 1: 512 -->
  <rect x="298" y="60" width="44" height="280" rx="8" fill="#4bc0a0" fill-opacity="0.25" stroke="#4bc0a0" stroke-width="2"/>
  <text x="320" y="50" fill="#4bc0a0" text-anchor="middle">512</text>
  <text x="320" y="360" fill="#ebebf5" text-anchor="middle">Gemm + ELU</text>
  <text x="320" y="378" fill="#9a9fc0" text-anchor="middle" font-size="12">51,200</text>

  <!-- hidden 2: 256 -->
  <rect x="438" y="90" width="44" height="220" rx="8" fill="#4bc0a0" fill-opacity="0.25" stroke="#4bc0a0" stroke-width="2"/>
  <text x="460" y="80" fill="#4bc0a0" text-anchor="middle">256</text>
  <text x="460" y="330" fill="#ebebf5" text-anchor="middle">Gemm + ELU</text>
  <text x="460" y="348" fill="#9a9fc0" text-anchor="middle" font-size="12">131,328</text>

  <!-- hidden 3: 128 -->
  <rect x="558" y="120" width="44" height="160" rx="8" fill="#4bc0a0" fill-opacity="0.25" stroke="#4bc0a0" stroke-width="2"/>
  <text x="580" y="110" fill="#4bc0a0" text-anchor="middle">128</text>
  <text x="580" y="300" fill="#ebebf5" text-anchor="middle">Gemm + ELU</text>
  <text x="580" y="318" fill="#9a9fc0" text-anchor="middle" font-size="12">32,896</text>

  <!-- output: 29 actions -->
  <rect x="668" y="160" width="44" height="80" rx="8" fill="#ff6384" fill-opacity="0.25" stroke="#ff6384" stroke-width="2"/>
  <text x="690" y="150" fill="#ff6384" text-anchor="middle">actions</text>
  <text x="690" y="260" fill="#ebebf5" text-anchor="middle">29</text>
  <text x="690" y="278" fill="#ebebf5" text-anchor="middle">Gemm</text>
  <text x="690" y="296" fill="#9a9fc0" text-anchor="middle" font-size="12">3,741</text>

  <!-- after the network: to joint targets -->
  <line x1="716" y1="200" x2="756" y2="200" stroke="#9a9fc0" stroke-width="2"/>
  <polygon points="756,194 766,200 756,206" fill="#9a9fc0"/>
  <text x="772" y="186" fill="#ebebf5">default pose</text>
  <text x="772" y="204" fill="#ebebf5">+ scale × action</text>
  <text x="772" y="222" fill="#9a9fc0" font-size="12">→ joint targets</text>
  <text x="772" y="238" fill="#9a9fc0" font-size="12">(outside the file)</text>

  <!-- footer -->
  <text x="24" y="412" fill="#9a9fc0" font-size="13">219,165 weights × 4 bytes ≈ 877 KB (the file is 881 KB) · exported from PyTorch 2.9 · ELU(x) = x if x &gt; 0, else eˣ − 1</text>
</svg>
