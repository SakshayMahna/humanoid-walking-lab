<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="640" height="260" rx="10" fill="#12141f"/>
  <!-- target wall -->
  <rect x="40" y="40" width="16" height="180" fill="#3a3f5c"/>
  <g stroke="#6b7194" stroke-width="2">
    <line x1="40" y1="50" x2="28" y2="62"/><line x1="40" y1="80" x2="28" y2="92"/>
    <line x1="40" y1="110" x2="28" y2="122"/><line x1="40" y1="140" x2="28" y2="152"/>
    <line x1="40" y1="170" x2="28" y2="182"/><line x1="40" y1="200" x2="28" y2="212"/>
  </g>
  <text x="48" y="32" fill="#c8c8d8" text-anchor="middle">target</text>

  <!-- spring (P term) -->
  <polyline fill="none" stroke="#36a2eb" stroke-width="3" stroke-linejoin="round"
    points="56,95 110,95 125,75 155,115 185,75 215,115 245,75 275,115 305,75 320,95 380,95"/>
  <text x="218" y="62" fill="#36a2eb" text-anchor="middle">spring  K<tspan baseline-shift="sub" font-size="11">P</tspan> · error</text>

  <!-- damper (D term) -->
  <line x1="56" y1="170" x2="190" y2="170" stroke="#ff6384" stroke-width="3"/>
  <polyline fill="none" stroke="#ff6384" stroke-width="3" points="250,150 190,150 190,190 250,190"/>
  <line x1="215" y1="155" x2="215" y2="185" stroke="#ff6384" stroke-width="4"/>
  <line x1="215" y1="170" x2="380" y2="170" stroke="#ff6384" stroke-width="3"/>
  <text x="218" y="215" fill="#ff6384" text-anchor="middle">damper  − K<tspan baseline-shift="sub" font-size="11">D</tspan> · velocity</text>

  <!-- mass (the pendulum) -->
  <rect x="380" y="70" width="110" height="125" rx="8" fill="#4bc0a0"/>
  <text x="435" y="128" fill="#12141f" text-anchor="middle" font-weight="bold">pendulum</text>
  <text x="435" y="148" fill="#12141f" text-anchor="middle">inertia I</text>

  <!-- gravity -->
  <line x1="510" y1="132" x2="600" y2="132" stroke="#ffce56" stroke-width="3"/>
  <polygon points="600,124 616,132 600,140" fill="#ffce56"/>
  <text x="560" y="118" fill="#ffce56" text-anchor="middle">gravity</text>
  <text x="560" y="160" fill="#ffce56" text-anchor="middle">m g L sin q</text>
</svg>
